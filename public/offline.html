<title>Offline — Keja.ai</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FBF9F4;

  a { display:inline-block; margin-top:1.25rem; background:linear-gradient(135deg,#5C471A,#8A6B26); color:#fff;
       padding:.8rem 1.6rem; border-radius:.6rem; text-decoration:none; font-weight:600; font-size:.9rem;
       font-family:-apple-system, system-ui, sans-serif; }
</style>
</head>
<body>
  <div class="box">
    <h1>You are offline</h1>
