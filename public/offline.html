<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10201b" />
<title>Offline — Keja AI</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f7f5ef; font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
         color:#191612; text-align:center; padding:2rem; }
  @media (prefers-color-scheme: dark) {
    body { background:#10201b; color:#f3efe4; }
    h1 { color:#d9b45c !important; }
    p { color:#b9b3a2 !important; }
    a { background:linear-gradient(135deg,#14532d,#166534); }
  }
  .box { max-width: 420px; }
  .mark { width:44px; height:44px; margin:0 auto 1rem; border-radius:12px;
          background:linear-gradient(135deg,#14532d,#1e6b3a); display:flex; align-items:center;
          justify-content:center; color:#d9b45c; font-weight:800; font-size:1.15rem; }
  h1 { font-size: 1.65rem; margin: 0 0 .75rem; color:#14532d; letter-spacing:-.02em; }
  p { line-height: 1.7; color:#6b6459; font-size:.95rem; }
  a { display:inline-block; margin-top:1.4rem; background:linear-gradient(135deg,#14532d,#1e6b3a); color:#fff;
      padding:.8rem 1.7rem; border-radius:.75rem; text-decoration:none; font-weight:700; font-size:.9rem; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark" aria-hidden="true">K</div>
    <h1>You&rsquo;re offline</h1>
    <p>This page needs a connection to load. Reconnect and try again &mdash; pages you have already visited remain available from cache.</p>
    <a href="./">Try again</a>
  </div>
</body>
</html>
