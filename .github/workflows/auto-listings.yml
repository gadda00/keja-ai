# Keja Auto-Pilot — AI automatic listing ingestion.
#
# Runs the code-automated pipeline (market scanner + partner feed adapters →
# AI enrichment → dedupe → quality gate → publish) on a schedule. When new
# listings are published, the updated data file is committed, which triggers
# the main deploy workflow — the marketplace grows itself, end to end.
#
#   schedule : every 6 hours (04:10, 10:10, 16:10, 22:10 UTC)
#   dispatch : manual, with an optional volume override
name: Auto-Pilot listings

on:
  schedule:
    - cron: '10 4,10,16,22 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Scanner volume for this run (1-12)'
        default: '4'
        required: false

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  ingest:
    outputs:
      changed: ${{ steps.pipeline.outputs.changed }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Auto-Pilot pipeline
        id: pipeline
        env:
          # Pass user input through env — never interpolate it directly into
          # the shell string (GitHub script-injection hardening guidance).
          COUNT: ${{ github.event.inputs.count || '4' }}
        run: |
          echo "Running Auto-Pilot (scanner volume: $COUNT)"
          # Exit code 3 = nothing new (still a success for CI)
          node scripts/auto-listings/run.mjs --count "$COUNT" && echo "changed=true" >> "$GITHUB_OUTPUT" || {
            code=$?
            if [ "$code" -eq 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
            else exit $code; fi
          }

      - name: Commit new listings
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "keja-autopilot[bot]"
          git config user.email "autopilot@keja.ai"
          git add src/data/auto-listings.json
          git commit -m "chore(autopilot): ingest new listings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "Committed — the gated deploy job below (same workflow) ships it."

      - name: Run summary
        run: |
          echo "### Auto-Pilot run complete" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node -e "
            const d = require('./src/data/auto-listings.json');
            const r = d.runs[0];
            console.log('run        :', r.id);
            console.log('ingested   :', r.ingested, '(scanner', r.sources.scanner, '+ feeds', r.sources.feeds + ')');
            console.log('published  :', r.published, '| queued:', r.queued, '| rejected:', r.rejected, '| deduped:', r.deduped);
            console.log('inventory  :', d.listings.length, 'live auto-listings /', d.pending.length, 'pending review');
            console.log('feed health:', JSON.stringify(r.feedStatus));
          " >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Deploy only when the pipeline actually published new listings. This used
  # to be handled by deploy-pages.yml's workflow_run trigger, which rebuilt
  # production on every Auto-Pilot run — including the ~3/4 runs that ingest
  # nothing. Gating here removes those no-op production deployments.
  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the ingest job just pushed the new listings commit — check out main
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm test

      - name: Lint (oxlint fast pass)
        run: npx oxlint src

      - name: Lint (ESLint flat config, blocking)
        run: npm run lint:eslint

      - name: Generate sitemap (properties + articles + routes)
        run: node scripts/generate-sitemap.mjs

      - name: Build (with GitHub Pages base path)
        run: npm run build -- --base=/keja-ai/

      - name: SPA fallback (404 page)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
