name: Deploy to Netlify (keja.app)

# The canonical production deployment: every push to main that passes the
# quality pipeline ships to Netlify (keja-ai.netlify.app / keja.app).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node runs the build; Bun installs dependencies — the repo's lockfile
      # is bun.lock (there is no package-lock.json, so `npm ci` cannot work).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Static export: the app is a client-side SPA (hash routing) — the
      # out/ bundle serves from the Netlify CDN, the PWA shell and the
      # Capacitor Android/iOS builds alike.
      - name: Build (static export)
        run: NEXT_STATIC=1 npx next build

      - name: Stamp service-worker cache version
        run: node scripts/sw-version.mjs

      # API (zip) deploys never read netlify.toml — the redirect + header
      # rules must ship inside out/ as _redirects / _headers (Next copies
      # them there from public/).
      - name: Verify Netlify config files in bundle
        run: |
          test -f out/_redirects || { echo "out/_redirects missing"; exit 1; }
          test -f out/_headers  || { echo "out/_headers missing";  exit 1; }

      - name: Check Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are not set."
            echo "::error::Repo Settings → Secrets and variables → Actions → add both, then re-run."
            exit 1
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          zip -qr out.zip out
          resp=$(curl -s -X POST "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @out.zip)
          deploy_id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "Deploy failed: $resp" && exit 1
          fi
          echo "Deploy started: $deploy_id"
          for i in $(seq 1 30); do
            state=$(curl -s "https://api.netlify.com/api/v1/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" | jq -r '.state')
            echo "  state: $state"
            [ "$state" = "ready" ] && break
            [ "$state" = "error" ] && exit 1
            sleep 10
          done
          [ "$state" = "ready" ] || { echo "Deploy did not become ready"; exit 1; }
          echo "Live: https://keja.app"
