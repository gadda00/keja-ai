name: Deploy to Netlify (keja.app)

# The canonical production deployment: every push to main that passes the
# quality pipeline ships to Netlify (keja-ai.netlify.app / keja.app).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Static export: the app is a client-side SPA (hash routing) — the
      # out/ bundle serves from the Netlify CDN, the PWA shell and the
      # Capacitor Android/iOS builds alike.
      - name: Build (static export)
        run: NEXT_STATIC=1 npx next build

      - name: Stamp service-worker cache version
        run: node scripts/sw-version.mjs

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          zip -qr out.zip out
          resp=$(curl -s -X POST "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys" \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @out.zip)
          deploy_id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "Deploy failed: $resp" && exit 1
          fi
          echo "Deploy started: $deploy_id"
          for i in $(seq 1 30); do
            state=$(curl -s "https://api.netlify.com/api/v1/deploys/${deploy_id}" \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" | jq -r '.state')
            echo "  state: $state"
            [ "$state" = "ready" ] && break
            [ "$state" = "error" ] && exit 1
            sleep 10
          done
          [ "$state" = "ready" ] || { echo "Deploy did not become ready"; exit 1; }
          echo "Live: https://keja.app"
