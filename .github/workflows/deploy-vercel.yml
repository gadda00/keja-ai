name: Deploy to Vercel (keja.app)

# The canonical production deployment: every push to main that passes the
# quality pipeline ships to Vercel (keja.app / keja-ai-rho.vercel.app).
#
# Deployment reality (verified 2026-09-12, see docs/DEPLOYMENT.md §1):
# the Vercel Git integration IS connected to this repo and builds+deploys
# every push to main within ~1 minute — including the Auto-Pilot's
# GITHUB_TOKEN pushes, which can never trigger this workflow (GitHub's
# recursion-prevention rule). This workflow is therefore the SECOND deploy
# path, not the only one:
#
#   1. Vercel Git integration — primary, deploys everything (bot data too).
#   2. This workflow — quality gates for human pushes, then EITHER skips its
#      own deploy (the integration already shipped this exact SHA —
#      scripts/deploy-guard.mjs answers that against the GitHub deployments
#      API) OR falls back to the CLI prebuilt deploy when the integration
#      failed / is absent. Either way it ends with the production smoke
#      test, which the integration does not run on its own.
#
# The CLI fallback needs the VERCEL_TOKEN repo secret; deploys use the
# `vercel pull → build --prod → deploy --prebuilt` flow, and `vercel
# build` compiles vercel.json routing/headers into .vercel/output.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-prod
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_VQjzdNuqoqHf2Yr93IBcJD6b
  VERCEL_PROJECT_ID: prj_XnyidS1Fw1Go6a3btvnAs5knexPR
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # Node runs the build; Bun installs dependencies — the repo's lockfile
      # is bun.lock (there is no package-lock.json, so `npm ci` cannot work).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Check Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set."
            echo "::error::Repo Settings → Secrets and variables → Actions → add it, then re-run."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Note: there is deliberately no standalone `npm run build` step here.
      # The artifact-level gates (sitemap, prerender, preload injection, SW
      # stamp, verify-artifacts — the full buildCommand) run inside every
      # deployment path that can produce an artifact: the Vercel Git
      # integration's build (a failed gate fails its deployment, which the
      # guard below detects and answers with a CLI fallback) and this
      # workflow's own `vercel build --prod`. What this workflow always owns
      # for every push: source gates (typecheck/lint/tests above) + the live
      # production smoke tests below.

      # Ask the GitHub deployments API whether the Vercel Git integration
      # already deployed this exact SHA. It starts at push time, but its
      # deployment RECORD can lag the push by ~90 s (live measurement
      # 2026-09-12: gates finished at T+70 s, record appeared at T+73 s — the
      # guard's first check raced it), so the guard waits through a 3-minute
      # grace for the record to appear before concluding the integration is
      # absent, then through the 6-minute window for its build to finish.
      #   skip   → integration deployed; this workflow goes straight to smoke
      #   deploy → integration failed/absent; CLI prebuilt deploy below
      # Fails open (API trouble → deploy): degradation is a duplicate
      # deployment, never a missing one.
      - name: Deploy guard — did the Git integration already ship this SHA?
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/deploy-guard.mjs \
            --repo "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --token "$GITHUB_TOKEN" \
            --wait-minutes 6

      - name: Link Vercel project
        if: steps.guard.outputs.should-deploy == 'true'
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Pull project settings
        if: steps.guard.outputs.should-deploy == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      # Static export + service-worker version stamp, then the routing and
      # header rules from vercel.json are compiled into .vercel/output.
      - name: Build (prebuilt)
        if: steps.guard.outputs.should-deploy == 'true'
        run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        if: steps.guard.outputs.should-deploy == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" 2>&1 | tail -n 20 | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -n 1)
          if [ -z "$url" ]; then
            echo "Deploy failed — no deployment URL found in CLI output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $url (raw URL is Vercel-auth-gated; smoke test below hits the public production alias)"

      # Raw deployment URLs are behind Vercel Authentication on Hobby — only
      # the project's assigned production domain (and custom domains) are
      # public. Smoke-test BOTH public surfaces: the production alias (which
      # reflects whichever deployment was promoted last) and the canonical
      # domain real users type. The routing contract assertions (real 404s,
      # prerendered sections) run against the alias; the canonical domain gets
      # the availability + PWA + security-header checks.
      - name: Smoke-test the production alias
        env:
          URL: https://keja-ai-rho.vercel.app
        run: |
          # Give the alias propagation a moment, then check with retries.
          fail=0
          for attempt in 1 2 3 4 5; do
            code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$URL/" || echo 000)
            echo "attempt $attempt: GET / -> $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "Production alias did not return 200"; exit 1; }
          headers=$(curl -sI --max-time 30 "$URL/sw.js" || true)
          echo "$headers" | grep -qi "^cache-control: public, max-age=0, must-revalidate" \
            && echo "GET /sw.js cache-control -> OK" || { echo "GET /sw.js cache-control -> FAIL"; fail=1; }
          echo "$headers" | grep -qi "^x-frame-options: DENY" \
            && echo "GET /sw.js security hdrs -> OK" || { echo "GET /sw.js security hdrs -> FAIL"; fail=1; }
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$URL/manifest.webmanifest" || echo 000)
          echo "GET /manifest.webmanifest-> $code"; [ "$code" = "200" ] || fail=1
          # Routing contract (2026-09-12): unknown paths must return a real
          # 404 (no more catch-all rewrite serving the home shell with HTTP
          # 200 — soft-404s), prerendered sections serve their own HTML, and
          # the app-workspace sections are prerendered noindexed shells (no
          # vercel.json rewrites — regex sources proved unreliable on
          # Vercel's path-to-regexp engine).
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$URL/__smoke_deep_link__" || echo 000)
          echo "GET /__smoke_deep_link__ -> $code (expect 404, no soft-404)"; [ "$code" = "404" ] || fail=1
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$URL/tokenize/" || echo 000)
          echo "GET /tokenize/ -> $code (prerendered section)"; [ "$code" = "200" ] || fail=1
          section_title=$(curl -s --max-time 30 "$URL/tokenize/" | grep -oE "<title>[^<]*</title>" | head -n 1)
          echo "GET /tokenize/ title -> $section_title"
          echo "$section_title" | grep -qi "tokenize" \
            || { echo "prerendered section carries the generic home title"; fail=1; }
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "$URL/finance/" || echo 000)
          echo "GET /finance/ -> $code (prerendered app shell)"; [ "$code" = "200" ] || fail=1
          finance_html=$(curl -s --max-time 30 "$URL/finance/")
          echo "$finance_html" | grep -qi "<title>Finance centre</title>" \
            || { echo "finance shell lost its title"; fail=1; }
          echo "$finance_html" | grep -qi 'name="robots" content="noindex"' \
            || { echo "finance shell is not noindexed"; fail=1; }
          if [ "$fail" = 0 ]; then echo "Smoke test PASSED — production alias is live."; else echo "Smoke test FAILED"; exit 1; fi

      # The canonical domain is what real users type; it must serve the same
      # deployment the alias does (DNS at Spaceship → Vercel anycast).
      - name: Smoke-test the canonical domain (keja.app)
        run: |
          fail=0
          for attempt in 1 2 3 4 5; do
            code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "https://keja.app/" || echo 000)
            echo "attempt $attempt: GET https://keja.app/ -> $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "keja.app did not return 200"; fail=1; }
          headers=$(curl -sI --max-time 30 "https://keja.app/sw.js" || true)
          echo "$headers" | grep -qi "^cache-control: public, max-age=0, must-revalidate" \
            && echo "keja.app /sw.js cache-control -> OK" || { echo "keja.app /sw.js cache-control -> FAIL"; fail=1; }
          echo "$headers" | grep -qi "^x-frame-options: DENY" \
            && echo "keja.app /sw.js security hdrs -> OK" || { echo "keja.app /sw.js security hdrs -> FAIL"; fail=1; }
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "https://keja.app/manifest.webmanifest" || echo 000)
          echo "keja.app /manifest.webmanifest -> $code"; [ "$code" = "200" ] || fail=1
          # real 404s on the canonical domain too (the routing contract must
          # hold where users actually land, not only on the alias)
          code=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" "https://keja.app/__smoke_deep_link__" || echo 000)
          echo "keja.app unknown path -> $code (expect 404)"; [ "$code" = "404" ] || fail=1
          if [ "$fail" = 0 ]; then echo "Canonical domain smoke PASSED."; else echo "Canonical domain smoke FAILED"; exit 1; fi
