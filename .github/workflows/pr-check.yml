# PR / branch quality gate — typecheck, lint and a static-export build must
# pass before anything reaches main (and therefore production).
name: PR check

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # bun.lock is the repo lockfile — `npm ci` has no package-lock.json
      # to consume and fails.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The canonical build (audit SEC-202): static export + sitemap +
      # prerender + SW version stamp + artifact assertions, so a PR can
      # never be green while the release artifact is broken.
      - name: Build (static export + artifact assertions)
        run: npm run build
