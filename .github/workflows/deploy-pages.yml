name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Auto-Pilot commits are pushed with the default GITHUB_TOKEN, which
  # deliberately does not trigger on:push workflows — so we also deploy when
  # the Auto-Pilot run itself completes successfully on main.
  workflow_run:
    workflows: ['Auto-Pilot listings']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests (finance, scoring, search engines)
        run: npm test

      - name: Lint (blocking quality gate)
        run: npx oxlint src

      - name: Generate sitemap (properties + articles + routes)
        run: node scripts/generate-sitemap.mjs

      - name: Build (with GitHub Pages base path)
        run: npm run build -- --base=/keja-ai/

      - name: SPA fallback (404 page)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
