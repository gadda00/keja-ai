name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Auto-Pilot no longer triggers this workflow: its own auto-listings.yml
  # gates a self-contained deploy job on `changed == true`, which avoids
  # rebuilding production on no-op ingestion runs.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests (finance, scoring, search engines)
        run: npm test

      - name: Lint (oxlint fast pass)
        run: npx oxlint src

      - name: Lint (ESLint flat config, blocking)
        run: npm run lint:eslint

      - name: Generate sitemap (properties + articles + routes)
        run: node scripts/generate-sitemap.mjs

      - name: Build (with GitHub Pages base path)
        run: npm run build -- --base=/keja-ai/

      - name: SPA fallback (404 page)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
